name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3-Codigo-do-App-Real/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar .env.local com as chaves
        working-directory: 3-Codigo-do-App-Real
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_ADMOB_BANNER_ID=${{ secrets.VITE_ADMOB_BANNER_ID }}" >> .env.local
          echo "VITE_REVENUECAT_API_KEY=${{ secrets.VITE_REVENUECAT_API_KEY }}" >> .env.local
          echo "VITE_REVENUECAT_PRODUCT_ID=${{ secrets.VITE_REVENUECAT_PRODUCT_ID }}" >> .env.local
          echo "VITE_STRIPE_PAYMENT_LINK=${{ secrets.VITE_STRIPE_PAYMENT_LINK }}" >> .env.local

      - name: Instalar dependências
        working-directory: 3-Codigo-do-App-Real
        run: npm ci

      - name: Build web (Vite)
        working-directory: 3-Codigo-do-App-Real
        run: npm run build

      - name: Sincronizar web com o projeto Android
        working-directory: 3-Codigo-do-App-Real
        run: npx cap sync android

      - name: Dar permissão de execução ao gradlew
        working-directory: 3-Codigo-do-App-Real/android
        run: chmod +x gradlew

      - name: Build APK (debug)
        working-directory: 3-Codigo-do-App-Real/android
        run: ./gradlew assembleDebug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: fe-diaria-debug
          path: 3-Codigo-do-App-Real/android/app/build/outputs/apk/debug/*.apk